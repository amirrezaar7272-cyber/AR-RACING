plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ar.racing'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ar.racing'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

configurations {
    natives
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"

    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
}

tasks.register('copyAndroidNatives') {
    doLast {
        def abiFolders = [
            'natives-armeabi-v7a.jar': 'armeabi-v7a',
            'natives-arm64-v8a.jar': 'arm64-v8a',
            'natives-x86.jar': 'x86',
            'natives-x86_64.jar': 'x86_64'
        ]

        configurations.natives.files.each { jarFile ->
            def abi = abiFolders.find { suffix, folder -> jarFile.name.endsWith(suffix) }?.value
            if (abi != null) {
                copy {
                    from zipTree(jarFile)
                    include '*.so'
                    into file("src/main/jniLibs/$abi")
                }
            }
        }
    }
}

tasks.configureEach { task ->
    if (task.name.contains('merge') && task.name.contains('JniLibFolders')) {
        task.dependsOn tasks.named('copyAndroidNatives')
    }
}
